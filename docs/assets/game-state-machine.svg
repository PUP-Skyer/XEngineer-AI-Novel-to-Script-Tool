<text x="550" y="162" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#888888">→ 宣布结果 Announce Results</text><rect x="50" y="280" width="420" height="90" rx="4" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="0.8"/>
<text x="260" y="300" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="bold" fill="#333333">Judgment Engine 胜负判定引擎</text>
<text x="70" y="320" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#666666">• Accuracy-based scoring system (推理准确度评分)</text>
<text x="70" y="336" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#666666">• G-Coin rewards: ≥90% ×3  |  ≥70% ×2  |  ≥50% ×1  |  <50% ×0.5</text>
<text x="70" y="352" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#666666">• Each phase has independent timeout mechanism (独立超时机制)</text><rect x="510" y="280" width="440" height="90" rx="4" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="0.8"/>
<text x="730" y="300" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="bold" fill="#333333">WebSocket Realtime Communication</text>
<text x="530" y="320" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#666666">• Event-driven: join_room → player_move → make_choice → cast_vote</text>
<text x="530" y="336" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#666666">• Redis adapter for multi-process scaling (Redis 多进程扩展)</text>
<text x="530" y="352" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#666666">• Reconnection support · AI player auto-decision</text><text x="40" y="72" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7" fill="#888888">Sub-states: 等待 → 选角色 → 就绪</text><text x="450" y="72" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7" fill="#888888">Sub-states: 发言 → AI参与 → 辩论</text><text x="720" y="72" font-family="'Helvetica Neue',Arial,sans-serif" font-size="7" fill="#888888">Sub-states: 投票 → 计票 → 公布</text><text x="500" y="708" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8" fill="#888888">AI-SCRIPT-GAME · Paper-style Architecture Diagram</text></svg>