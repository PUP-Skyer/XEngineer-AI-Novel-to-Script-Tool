<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0a0a0f" stroke="url(#neonGrad)" stroke-width="2" filter="url(#glow)"/>
  <text x="32" y="28" text-anchor="middle" fill="url(#neonGrad)" font-family="monospace" font-weight="bold" font-size="16" filter="url(#glow)">AI</text>
  <text x="32" y="48" text-anchor="middle" fill="#e8e8f0" font-family="sans-serif" font-weight="600" font-size="10">SCRIPT</text>
</svg>
